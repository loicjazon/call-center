[package]
name = "call-center"
version = "0.2.0"
edition = "2024"
description = "Indique si vos collègues Slack sont en huddle et vous prévient quand ils ont fini"
license = "MIT"
repository = "https://github.com/loicjazon/call-center"
readme = "README.md"

[dependencies]
gtk = "0.18"
libappindicator = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

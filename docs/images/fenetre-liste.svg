<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="t">
  <title id="t">Fenêtre Call Center : recherche en haut, collègues avec leur statut en dessous</title>
  <style>
    text { font-family: Ubuntu, Cantarell, 'DejaVu Sans', sans-serif; font-size: 14px; }
    .muted { fill: #9a9a9a; }
    .row { fill: none; stroke: #1b2027; }
  </style>
  <rect x=".5" y=".5" width="379" height="329" rx="10" fill="#0a0d10" stroke="#272d36"/>
  <line x1="0" y1="38" x2="380" y2="38" stroke="#272d36"/>
  <g fill="#eeeeec">
  <text x="190" y="25" text-anchor="middle" font-weight="700">Call Center</text>
  <text x="358" y="25" class="muted">✕</text>
  <rect x="12" y="50" width="356" height="32" rx="6" fill="#0a0d10" stroke="#2f3640"/>
  <text x="26" y="71" class="muted">🔍  Ajouter un collègue…</text>

  <!-- Alice -->
  <circle cx="34" cy="116" r="16" fill="#5a8f6a"/><text x="34" y="122" text-anchor="middle" fill="#fff" style="font-size:16px">A</text>
  <text x="62" y="121">Alice Martin</text><text x="368" y="121" text-anchor="end" fill="#4ec27a">● en ligne</text>
  <line x1="12" y1="142" x2="368" y2="142" class="row"/>
  <!-- Bruno -->
  <circle cx="34" cy="168" r="16" fill="#b0653a"/><text x="34" y="174" text-anchor="middle" fill="#fff" style="font-size:16px">B</text>
  <text x="62" y="173">Bruno Leroy</text><text x="368" y="173" text-anchor="end" fill="#ee5a5a">● en call 🔔</text>
  <line x1="12" y1="194" x2="368" y2="194" class="row"/>
  <!-- Chloé -->
  <circle cx="34" cy="220" r="16" fill="#7a5aa6"/><text x="34" y="226" text-anchor="middle" fill="#fff" style="font-size:16px">C</text>
  <text x="62" y="225">Chloé Durand</text><text x="368" y="225" text-anchor="end" fill="#ee5a5a">● en call</text>
  <line x1="12" y1="246" x2="368" y2="246" class="row"/>
  <!-- David -->
  <circle cx="34" cy="272" r="16" fill="#4a7fb0"/><text x="34" y="278" text-anchor="middle" fill="#fff" style="font-size:16px">D</text>
  <text x="62" y="277">David Petit</text><text x="368" y="277" text-anchor="end" class="muted">● hors ligne</text>
  <text x="14" y="318" class="muted" style="font-size:12px">Clic sur un collègue en call : activer ou retirer la cloche 🔔</text>
  </g>
</svg>
